<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Avaliacao Google</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#5d6675}</style>
</head>
<body>
<p>Abrindo...</p>
<script>
(async function() {
  var params = new URLSearchParams(location.search);
  var id = (params.get('p') || location.hash.replace(/#/, '')).toUpperCase().replace(/[^A-Z0-9]/g, '');

  if (!id) { document.querySelector('p').textContent = 'Codigo nao encontrado.'; return; }

  try {
    // Verifica contatos.json — se tiver Instagram, WhatsApp ou Wi-Fi vai para conecte.html
    try {
      var rc = await fetch('/contatos.json?_=' + Date.now());
      var contatos = await rc.json();
      var c = contatos[id] || contatos[id.toLowerCase()];
      if (c && (c.instagram || c.whatsapp || c.wifi_nome)) {
        location.replace('/conecte.html?p=' + id);
        return;
      }
    } catch(e) {}

    // Sem campos Pro — vai direto para o Google pelo placas.json
    var res = await fetch('/placas.json?_=' + Date.now());
    var placas = await res.json();
    var url = placas[id] || placas[id.toLowerCase()] || '';
    if (!url) { document.querySelector('p').textContent = 'Placa "' + id + '" nao encontrada.'; return; }
    location.replace(url);
  } catch(e) {
    document.querySelector('p').textContent = 'Erro ao buscar placa.';
  }
})();
</script>
</body>
</html>
