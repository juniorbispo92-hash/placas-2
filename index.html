<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Avaliação Google</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#5d6675}</style>
</head>
<body>
<p>Abrindo...</p>
<script>
(async function() {
  var params = new URLSearchParams(location.search);
  var id = (params.get('p') || location.hash.replace(/#/, '')).toUpperCase().replace(/[^A-Z0-9]/g, '');

  if (!id) { document.querySelector('p').textContent = 'Código não encontrado.'; return; }

  try {
    var res = await fetch('/placas.json?_=' + Date.now());
    var placas = await res.json();
    // Formato: { "CODIGO": "https://..." }
    var url = placas[id] || placas[id.toLowerCase()] || '';
    if (!url) { document.querySelector('p').textContent = 'Placa "' + id + '" não encontrada.'; return; }
    location.replace(url);
  } catch(e) {
    document.querySelector('p').textContent = 'Erro ao buscar placa.';
  }
})();
</script>
</body>
</html>
