<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: 56px; height: 56px;
    background: #2563eb;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
  }
  h1 { font-size: 20px; font-weight: 700; }
  p { font-size: 14px; color: #94a3b8; max-width: 280px; line-height: 1.6; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #334155;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: #450a0a; color: #fca5a5;
    border: 1px solid #dc2626;
    border-radius: 12px; padding: 16px 20px;
    font-size: 13px; max-width: 300px; display: none;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #2563eb; color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    text-decoration: none; margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
      <path d="M5 12.5a7 7 0 0 1 7-7"/>
      <path d="M5 16.5a11 11 0 0 1 11-11"/>
      <circle cx="5" cy="12.5" r="1.5" fill="#fff" stroke="none"/>
    </svg>
  </div>
  <h1>Redirecionando...</h1>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Buscando link de avaliação, aguarde um momento.</p>
  <div class="error-box" id="errorBox"></div>
  <a href="https://neovibeavalie.com.br" class="btn" id="homeBtn">← Voltar ao início</a>

<script>
const SUPABASE_URL = 'https://niozrlfufwihbrtsldbo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_B8Z2TT6kNMEI7_H-XOTlHA_pfm7CcQ0';

async function redirect() {
  // Pega o código da URL: neovibeavalie.com.br/CODIGO
  // ou neovibeavalie.com.br/r.html?c=CODIGO
  let codigo = '';

  // Tenta pegar do query string ?p=CODIGO ou ?c=CODIGO
  const params = new URLSearchParams(window.location.search);
  if (params.get('p')) {
    codigo = params.get('p').toUpperCase();
  } else if (params.get('c')) {
    codigo = params.get('c').toUpperCase();
  } else {
    // Tenta pegar do pathname: /CODIGO
    const path = window.location.pathname.replace(/^\//, '').replace(/\.html$/, '');
    if (path && path !== 'r' && path !== 'index') {
      codigo = path.toUpperCase();
    }
  }

  if (!codigo) {
    showError('Código não encontrado na URL.');
    return;
  }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/placas?codigo=eq.${encodeURIComponent(codigo)}&select=url,codigo&limit=1`,
      { headers: { 'apikey': SUPABASE_KEY } }
    );
    const data = await res.json();

    if (!data || !data.length) {
      showError(`Placa "${codigo}" não encontrada.`);
      return;
    }

    const url = data[0].url;
    if (!url) {
      showError(`Esta placa (${codigo}) ainda não tem link de avaliação configurado.`);
      return;
    }

    // Redireciona!
    document.getElementById('msg').textContent = 'Abrindo avaliação Google...';
    window.location.href = url;

  } catch (e) {
    showError('Erro ao buscar placa: ' + e.message);
  }
}

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('msg').style.display = 'none';
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
  document.getElementById('homeBtn').style.display = 'inline-flex';
}

redirect();
</script>
</body>
</html>
